<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>

    <!-- 引入资源 -->
    <link rel="stylesheet" href="../static/element-ui/lib/theme-chalk/index.css">
    <script src="../static/js/vue.js"></script>
    <script src="../static/axios/dist/axios.js"></script>
    <script src="../static/element-ui/lib/index.js"></script>

    <!-- 引入 Markdown 解析器和安全清洗库 (根据你的路径) -->
    <script src="../static/marked/marked.min.js"></script>
    <script src="../static/dompurify/dist/purify.min.js"></script>

    <style>
        /* 全局重置与基础样式 */
        body { margin: 0; padding: 0; background-color: #f0f2f5; font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif; }
        #app { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; background: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.1); }

        /* 顶部标题栏 */
        .header { padding: 15px 20px; background: #fff; border-bottom: 1px solid #e6e6e6; font-weight: bold; font-size: 18px; color: #333; }

        /* 聊天内容区域 */
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; background-color: #f5f7fa; }

        /* 消息行容器 */
        .message-row { display: flex; margin-bottom: 20px; align-items: flex-start; }
        .message-row.user { flex-direction: row-reverse; } /* 用户消息靠右 */

        /* 头像样式 */
        .avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #ddd; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .ai-avatar { background-color: #409EFF; color: white; margin-right: 10px; }
        .user-avatar { background-color: #67C23A; color: white; margin-left: 10px; }

        /* 气泡样式 */
        .bubble { max-width: 70%; padding: 12px 16px; border-radius: 8px; font-size: 15px; line-height: 1.6; word-wrap: break-word; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .message-row.ai .bubble { background-color: #ffffff; border: 1px solid #ebeef5; border-top-left-radius: 2px; }
        .message-row.user .bubble { background-color: #ecf5ff; border: 1px solid #d9ecff; border-top-right-radius: 2px; color: #303133; }

        /* Markdown 内容样式优化 */
        .markdown-body p { margin: 0 0 10px; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body pre { background: #f6f8fa; padding: 10px; border-radius: 4px; overflow-x: auto; margin: 10px 0; }
        .markdown-body code { font-family: Consolas, Monaco, 'Andale Mono', monospace; background: #f0f0f0; padding: 2px 4px; border-radius: 3px; font-size: 0.9em; }
        .markdown-body pre code { background: transparent; padding: 0; }
        .markdown-body ul, .markdown-body ol { padding-left: 20px; margin: 5px 0; }
        .markdown-body blockquote { border-left: 4px solid #dfe2e5; color: #6a737d; padding-left: 10px; margin: 5px 0; }

        /* 底部输入框区域 */
        .input-area { padding: 20px; background: #fff; border-top: 1px solid #e6e6e6; display: flex; gap: 10px; align-items: center; }
        .input-area .el-input { flex: 1; }
    </style>
</head>
<body>

<div id="app">
    <!-- 顶部 -->
    <div class="header">Qwen AI 助手</div>

    <!-- 聊天记录区域 -->
    <div class="chat-box" ref="chatContainer">
        <div v-for="(item, index) in messages" :key="index" class="message-row" :class="item.role === 'user' ? 'user' : 'ai'">
            <!-- 头像 -->
            <div class="avatar" :class="item.role === 'user' ? 'user-avatar' : 'ai-avatar'">
                [{ item.role === 'user' ? '👤' : '🤖' }]
            </div>

            <!-- 消息气泡 -->
            <div class="bubble">
                <!-- 使用 v-html 渲染 Markdown 解析后的 HTML -->
                <div class="markdown-body" v-html="renderMarkdown(item.content)"></div>
            </div>
        </div>
    </div>

    <!-- 底部输入区域 -->
    <div class="input-area">
        <el-input
            v-model="question"
            placeholder="请输入您的问题..."
            @keyup.enter.native="chat"
            clearable
            size="medium">
        </el-input>
        <el-button type="primary" @click="chat" :loading="isLoading">发送</el-button>
    </div>
</div>

<script>
    // 创建vue.js对象
    let myApp = new Vue({
        el: '#app',
        delimiters:['[{','}]'],//修改vue取值方式,避免和jinja2模板冲突
        data() {
            return {
                question: '',
                isLoading: false, // 添加加载状态控制按钮
                messages: [
                    { role: 'system', content: '我是 qwen3.7-max，有什么可以帮助你？😊' },
                ]
            }
        },
        methods: {
            // 渲染 Markdown 的方法
            renderMarkdown(text) {
                if (!text) return '';
                // 1. 使用 marked 将 markdown 转为 html
                // 2. 使用 DOMPurify 清洗 html 防止 XSS 攻击
                const rawHtml = marked.parse(text);
                return DOMPurify.sanitize(rawHtml);
            },

            // 滚动到底部
            scrollToBottom() {
                this.$nextTick(() => {
                    const container = this.$refs.chatContainer;
                    container.scrollTop = container.scrollHeight;
                });
            },

            chat() {
                let myQuestion = this.question;
                if (!myQuestion) return; // 简单的空值检查

                myQuestion = myQuestion.trim();
                if (myQuestion === '') {
                    this.$message.warning("请输入问题");
                    return;
                }

                // 1. 添加用户消息
                this.messages.push({ role: 'user', content: myQuestion });
                this.question = ''; // 清空输入框
                this.scrollToBottom();

                // 2. 添加 AI "正在思考" 的占位消息
                // 注意：这里保持你的逻辑，role 设为 'content' (虽然通常用 'assistant'，但为了兼容你的后端逻辑不做修改)
                this.messages.push({ role: 'content', content: '正在思考...' });
                this.isLoading = true;
                this.scrollToBottom();

                // 3. 发送请求
                axios({
                    url: 'http://localhost:8000/chat/chatNoStream',
                    method: 'get',
                    params: {
                        question: myQuestion
                    }
                }).then(rs => {
                    console.log(rs.data);
                    // 更新最后一条消息的内容
                    // 假设 rs.data.data 是字符串格式的 Markdown
                    this.messages[this.messages.length - 1].content = rs.data.data;
                    this.isLoading = false;
                    this.scrollToBottom();
                }).catch(err => {
                    console.error(err);
                    this.messages[this.messages.length - 1].content = "抱歉，连接服务器失败，请稍后再试。";
                    this.isLoading = false;
                    this.scrollToBottom();
                });
            }
        },
        mounted() {
            this.scrollToBottom();
        }
    });
</script>
</body>
</html>
