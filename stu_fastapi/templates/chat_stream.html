<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>

    <!-- 引入资源 -->
    <link rel="stylesheet" href="../static/element-ui/lib/theme-chalk/index.css">
    <script src="../static/js/vue.js"></script>
    <script src="../static/axios/dist/axios.js"></script>
    <script src="../static/element-ui/lib/index.js"></script>

    <!-- 引入 Markdown 解析器和安全清洗库 -->
    <script src="../static/marked/marked.min.js"></script>
    <script src="../static/dompurify/dist/purify.min.js"></script>

    <style>
        /* 全局基础样式 */
        body { margin: 0; padding: 20px; background-color: #f5f7fa; font-family: sans-serif; }

        /* 聊天容器样式 */
        .chat-container {
            width: 100%; max-width: 800px; margin: 0 auto;
            height: 600px; background: #fff; border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0,0,0,0.1);
            display: flex; flex-direction: column;
        }

        /* 消息列表滚动区域 */
        .message-list {
            flex: 1; overflow-y: auto; padding: 20px;
        }

        /* 单条消息的布局 */
        .message-item { display: flex; margin-bottom: 15px; align-items: flex-start; }

        /* 头像样式 */
        .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }

        /* 气泡样式 */
        .bubble { max-width: 70%; padding: 10px 15px; border-radius: 8px; font-size: 14px; line-height: 1.6; word-break: break-word; }

        /* 用户消息靠右 */
        .message-item.user { justify-content: flex-end; }
        .message-item.user .avatar { background-color: #409eff; color: #fff; margin-left: 10px; order: 2; }
        .message-item.user .bubble { background-color: #ecf5ff; color: #333; border-top-right-radius: 2px; }

        /* AI消息靠左 */
        .message-item.ai { justify-content: flex-start; }
        .message-item.ai .avatar { background-color: #67c23a; color: #fff; margin-right: 10px; }
        .message-item.ai .bubble { background-color: #f4f4f5; color: #333; border-top-left-radius: 2px; }

        /* Markdown 内部元素美化 */
        .bubble pre { background-color: #282c34; color: #abb2bf; padding: 10px; border-radius: 4px; overflow-x: auto; margin: 8px 0; }
        .bubble code { font-family: Consolas, monospace; font-size: 13px; }
        .bubble p { margin: 0 0 8px 0; }
        .bubble p:last-child { margin-bottom: 0; }

        /* 底部输入区域 */
        .input-area { padding: 15px; border-top: 1px solid #ebeef5; display: flex; gap: 10px; }
    </style>
</head>
<body>
<!--相当于vue项目中的template-->
<div id="app">
    <div class="chat-container">
        <!-- 消息列表区域 -->
        <div class="message-list" ref="chatContainer">
            <div v-for="(item, index) in messages" :key="index"
                 :class="['message-item', item.role === 'user' ? 'user' : 'ai']">

                <!-- 头像 -->
                <div class="avatar">
                    <span v-if="item.role === 'user'">👤</span>
                    <span v-else>🤖</span>
                </div>

                <!-- 消息气泡 -->
                <div class="bubble">
                    <!-- 用户消息直接显示纯文本，AI消息使用 v-html 渲染 Markdown -->
                    <template v-if="item.role === 'user'">[{ item.content }]</template>
                    <div v-else v-html="renderMarkdown(item.content)"></div>
                </div>
            </div>
        </div>

        <!-- 底部输入区域 -->
        <div class="input-area">
            <el-input v-model="question" placeholder="请输入问题..." @keyup.enter.native="chat" :disabled="isLoading"></el-input>
            <el-button type="primary" @click="chat" :loading="isLoading">
                [{ isLoading ? '生成中...' : '提问' }]
            </el-button>
        </div>
    </div>
</div>

<script>
    let myApp = new Vue({
        el: '#app',
        delimiters: ['[{', '}]'], // 避免和 jinja2 冲突
        data() {
            return {
                question: '',
                isLoading: false,
                messages: [
                    { role: 'system', content: '我是 qwen3.7-max，有什么可以帮助你？😊' },
                ]
            }
        },
        methods: {
            // 渲染 Markdown 的方法 (保持你原有的逻辑)
            renderMarkdown(text) {
                if (!text) return '';
                const rawHtml = marked.parse(text);
                return DOMPurify.sanitize(rawHtml);
            },

            // 滚动到底部
            scrollToBottom() {
                this.$nextTick(() => {
                    const container = this.$refs.chatContainer;
                    if (container) {
                        container.scrollTop = container.scrollHeight;
                    }
                });
            },

            chat() {
                let _this = this;
                let myQuestion = this.question;
                if (!myQuestion) return;

                myQuestion = myQuestion.trim();
                if (myQuestion === '') {
                    this.$message.warning("请输入问题");
                    return;
                }

                // 1. 添加用户消息
                this.messages.push({ role: 'user', content: myQuestion });
                this.question = '';
                this.scrollToBottom();

                // 2. 添加 AI 占位消息
                this.messages.push({ role: 'content', content: '正在思考...' });
                this.isLoading = true;
                this.scrollToBottom();

                // 3. 构造 EventSource
                let s = ""; // 存储AI返回的回复
                let params = new URLSearchParams({ question: myQuestion });
                let eventSource = new EventSource('http://localhost:8000/chat/chatStream?' + params);

                eventSource.onopen = (event) => {
                    console.log("监听-连接成功打开", event);
                };

                eventSource.onerror = (event) => {
                    console.log("监听-有错误", event);
                    // 发生错误时也停止加载状态
                    _this.isLoading = false;
                    eventSource.close();
                };

                eventSource.onmessage = (event) => {
                    // event.data后端持续传来的流式数据
                    let newData = JSON.parse(event.data);
                    console.log("收到数据:", event.data);

                    // 【关键】检测结束标志
                    if (newData.content === "[DONE]") {
                        console.log("对话结束，主动关闭连接");
                        eventSource.close();
                        _this.isLoading = false;
                    } else {
                        s += newData.content;
                        // 更新最后一条消息的内容
                        _this.messages[_this.messages.length - 1].content = s;
                        _this.scrollToBottom(); // 每次收到数据都滚动到底部
                    }
                };
            }
        },
        mounted() {
            this.scrollToBottom();
        }
    });
</script>
</body>
</html>
